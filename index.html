<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Conduct · Ellsworth Park Ward</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FCFBF6;
  --card:#FFFFFF;
  --ink:#1E241C;
  --ink-soft:#5A6155;
  --green:#24422F;
  --green-deep:#16291D;
  --gold:#A0812F;
  --gold-soft:#EFE7D2;
  --rule:#E2DCCB;
  --danger:#8A3B2E;
  --radius:14px;
  --display:'Cormorant Garamond',Georgia,serif;
  --sans:'Albert Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font-family:var(--sans);cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- masthead ---------- */
.masthead{
  background:var(--green);
  color:var(--paper);
  text-align:center;
  padding:26px 20px 20px;
  border-bottom:3px solid var(--gold);
}
.masthead .app{
  font-size:11px;letter-spacing:.34em;text-transform:uppercase;
  color:var(--gold-soft);font-weight:600;
}
.masthead h1{
  font-family:var(--display);font-weight:600;
  font-size:clamp(30px,8vw,40px);line-height:1.08;margin-top:6px;
}
.masthead .sub{
  font-family:var(--display);font-style:italic;font-size:18px;
  color:var(--gold-soft);margin-top:2px;
}

/* ---------- date bar ---------- */
.datebar{
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:14px 16px 4px;
}
.datebar button.nav{
  background:none;border:1.5px solid var(--rule);border-radius:50%;
  width:38px;height:38px;font-size:17px;color:var(--green);flex:none;
}
.datewrap{position:relative;text-align:center;min-width:0}
.datewrap .dateline{
  font-family:var(--display);font-size:22px;font-weight:600;color:var(--green);
  white-space:nowrap;
}
.datewrap .hint{font-size:11px;color:var(--ink-soft);letter-spacing:.05em;text-transform:uppercase}
.datewrap input[type=date]{
  position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;
}
.status{
  text-align:center;font-size:13px;color:var(--ink-soft);padding:4px 20px 0;min-height:20px;
}
.status.err{color:var(--danger)}
.status button{background:none;border:none;color:var(--green);font-weight:600;text-decoration:underline;font-size:13px}

.topic{
  margin:12px 18px 0;padding:12px 16px;text-align:center;
  background:var(--gold-soft);border-radius:var(--radius);
  font-family:var(--display);font-size:18px;font-style:italic;color:var(--green-deep);
}
.topic:empty{display:none}

/* ---------- sections ---------- */
main{max-width:640px;margin:0 auto;padding:6px 16px 120px}
section.wave{
  background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);
  margin-top:18px;overflow:hidden;
}
.wavehead{
  display:flex;align-items:baseline;gap:12px;
  padding:14px 18px 10px;border-bottom:1px solid var(--rule);
}
.wavehead .num{
  font-family:var(--display);font-weight:700;font-size:24px;color:var(--gold);
  min-width:34px;
}
.wavehead h2{
  font-size:12px;letter-spacing:.22em;text-transform:uppercase;
  font-weight:700;color:var(--green);
}
.field{padding:12px 18px;border-bottom:1px solid #F0EDE2;position:relative}
.field:last-child{border-bottom:none}
.field label{
  display:flex;align-items:center;gap:8px;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-soft);font-weight:600;margin-bottom:3px;
}
.edited-dot{
  display:none;width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none;
}
.field.edited .edited-dot{display:inline-block}
.field.edited .resetbtn{display:inline}
.resetbtn{
  display:none;background:none;border:none;color:var(--gold);
  font-size:11px;font-weight:600;letter-spacing:.05em;margin-left:auto;
}
.field input,.field textarea{
  width:100%;border:none;background:transparent;color:var(--ink);
  font-family:var(--display);font-size:21px;font-weight:500;line-height:1.3;
  padding:2px 0;resize:none;
}
.field textarea{font-family:var(--sans);font-size:16px;line-height:1.45;min-height:26px}
.field input::placeholder,.field textarea::placeholder{color:#B9B4A4;font-style:italic}
.field.hymn input{font-size:22px}
.staticline{
  padding:14px 18px;background:#F7F4EA;
  font-family:var(--display);font-size:18px;font-style:italic;color:var(--green-deep);
  text-align:center;
}

/* ---------- start bar ---------- */
.startbar{
  position:fixed;left:0;right:0;bottom:0;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--paper) 70%,transparent);
  display:flex;justify-content:center;
}
.btn-primary{
  width:100%;max-width:640px;
  background:var(--green);color:var(--paper);
  border:none;border-radius:999px;
  font-size:17px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  padding:16px;box-shadow:0 4px 14px rgba(22,41,29,.25);
}
.btn-primary:active{background:var(--green-deep)}

/* ---------- meeting mode ---------- */
#meeting{display:none;flex-direction:column;min-height:100vh;min-height:100dvh}
body.in-meeting #overview{display:none}
body.in-meeting #meeting{display:flex}
.mhead{
  background:var(--green);color:var(--paper);
  padding:14px 18px 12px;border-bottom:3px solid var(--gold);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.mhead .ward{font-family:var(--display);font-size:17px;font-weight:600}
.mhead .exit{
  background:none;border:1px solid rgba(252,251,246,.4);color:var(--paper);
  border-radius:999px;font-size:12px;font-weight:600;padding:6px 14px;letter-spacing:.08em;
}
.progress{display:flex;justify-content:center;gap:26px;padding:16px 0 4px}
.progress .step{
  font-family:var(--display);font-weight:700;font-size:20px;color:#C9C3AF;
  border-bottom:3px solid transparent;padding:0 4px 3px;
}
.progress .step.done{color:var(--gold)}
.progress .step.now{color:var(--green);border-color:var(--gold)}
.mtitle{
  text-align:center;
  font-size:13px;letter-spacing:.26em;text-transform:uppercase;
  font-weight:700;color:var(--green);padding:8px 20px 2px;
}
.mbody{flex:1;max-width:640px;width:100%;margin:0 auto;padding:6px 22px 24px}
.mrow{padding:15px 0;border-bottom:1px solid var(--rule)}
.mrow:last-child{border-bottom:none}
.mrow .mlabel{
  font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-soft);font-weight:600;margin-bottom:4px;
}
.mrow .mvalue{
  font-family:var(--display);font-size:28px;font-weight:600;line-height:1.22;color:var(--ink);
  overflow-wrap:anywhere;
}
.mrow .mvalue.long{font-family:var(--sans);font-size:19px;font-weight:500;line-height:1.5;white-space:pre-wrap}
.mrow.hymnrow .mvalue{display:flex;align-items:baseline;gap:12px}
.hymnnum{
  font-family:var(--display);font-weight:700;font-size:40px;color:var(--gold);line-height:1;flex:none;
}
.mrow.static .mvalue{font-style:italic;color:var(--green-deep);font-size:24px}
.mnav{
  display:flex;gap:12px;max-width:640px;width:100%;margin:0 auto;
  padding:10px 18px calc(16px + env(safe-area-inset-bottom));
}
.mnav .back{
  flex:1;background:none;border:1.5px solid var(--rule);color:var(--green);
  border-radius:999px;font-size:16px;font-weight:600;padding:15px;
}
.mnav .next{
  flex:2;background:var(--green);border:none;color:var(--paper);
  border-radius:999px;font-size:16px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;padding:15px;
}
.mnav .next:active{background:var(--green-deep)}
</style>
</head>
<body>

<!-- ===================== OVERVIEW ===================== -->
<div id="overview">
  <header class="masthead">
    <div class="app">Conduct</div>
    <h1>Ellsworth Park Ward</h1>
    <div class="sub">Sacrament Meeting Agenda</div>
  </header>

  <div class="datebar">
    <button class="nav" id="prevSun" aria-label="Previous Sunday">‹</button>
    <div class="datewrap">
      <div class="dateline" id="dateLine">—</div>
      <div class="hint">tap to change date</div>
      <input type="date" id="datePick" aria-label="Choose meeting date">
    </div>
    <button class="nav" id="nextSun" aria-label="Next Sunday">›</button>
  </div>
  <div class="status" id="status"></div>
  <div class="topic" id="topicBox"></div>

  <main id="sections"></main>

  <div class="startbar">
    <button class="btn-primary" id="startBtn">Start Meeting</button>
  </div>
</div>

<!-- ===================== MEETING MODE ===================== -->
<div id="meeting">
  <div class="mhead">
    <div class="ward">Ellsworth Park Ward</div>
    <button class="exit" id="exitBtn">Overview</button>
  </div>
  <div class="progress" id="progress"></div>
  <div class="mtitle" id="mtitle"></div>
  <div class="mbody" id="mbody"></div>
  <div class="mnav">
    <button class="back" id="backBtn">Back</button>
    <button class="next" id="nextBtn">Next</button>
  </div>
</div>

<script>
/* ================= CONFIG ================= */
const CONFIG = {
  SHEET_ID: "1OXTKjK-WVJZbbNmG6vUP_I3h3DrFno0lKeRmrufLIBY",
  // Tab names in the workbook. If a tab is renamed, update it here.
  TAB: "Data Input",                   // one row per Sunday (main agenda grid)
  TAB_ANNOUNCEMENTS: "Announcements",  // A: date · B: announcements text
  TAB_BUSINESS: "Business"             // A: date · B/C released+calling · D/E called+calling · F other
};

// Column letters in the sheet (0 = A, 1 = B, ...)
const COL = { date:0, conducting:1, topic:2, openingHymn:3, invocation:4,
  sacramentHymn:5, speaker1:6, speaker2:7, musicalNumber:8, speaker3:9,
  closingHymn:10, benediction:11, chorister:12, organist:13 };

/* ================= FIELD DEFINITIONS =================
   src: column key = pulled from sheet; null = manual entry
   type: person | hymn | long
   optional: hidden in meeting mode when empty              */
const SECTIONS = [
  { num:"I", title:"Welcome & Opening", fields:[
    {id:"presiding",     label:"Presiding",            src:null, type:"person"},
    {id:"conducting",    label:"Conducting",           src:"conducting", type:"person"},
    {id:"chorister",     label:"Chorister",            src:"chorister", type:"person"},
    {id:"organist",      label:"Organist",             src:"organist", type:"person"},
    {id:"visiting",      label:"Visiting Authorities", src:null, type:"person", optional:true},
    {id:"announcements", label:"Announcements",        src:"@announcements", type:"long", optional:true},
    {id:"openingHymn",   label:"Opening Hymn",         src:"openingHymn", type:"hymn"},
    {id:"invocation",    label:"Invocation",           src:"invocation", type:"person"},
  ]},
  { num:"II", title:"Ward & Stake Business", fields:[
    {id:"wardBusiness",  label:"Ward Business",        src:"@business", type:"long", optional:true},
    {id:"releases",      label:"Releases & Callings",  src:"@business", type:"long", optional:true},
    {id:"stakeBusiness", label:"Stake Business",       src:null, type:"long", optional:true},
    {id:"sacramentHymn", label:"Sacrament Hymn",       src:"sacramentHymn", type:"hymn"},
  ], static:"Blessing and administration of the sacrament"},
  { num:"III", title:"Speakers", fields:[
    {id:"speaker1",      label:"Speaker 1",            src:"speaker1", type:"person", optional:true},
    {id:"speaker2",      label:"Speaker 2",            src:"speaker2", type:"person", optional:true},
    {id:"musicalNumber", label:"Musical Number",       src:"musicalNumber", type:"long", optional:true},
    {id:"speaker3",      label:"Speaker 3",            src:"speaker3", type:"person", optional:true},
  ]},
  { num:"IV", title:"Conclusion", fields:[
    {id:"closingHymn",   label:"Closing Hymn",         src:"closingHymn", type:"hymn"},
    {id:"benediction",   label:"Benediction",          src:"benediction", type:"person"},
  ]},
];

const ALL_FIELDS = SECTIONS.flatMap(s=>s.fields);

/* ================= STATE ================= */
let meetingDate = null;     // Date object (local midnight)
let sheetValues = {};       // fieldId -> value from sheet
let overrides   = {};       // fieldId -> locally edited value
let topic = "";
let sectionIdx = 0;
let wakeLock = null;

/* ================= SAFE STORAGE ================= */
const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} },
  del(k){ try{ localStorage.removeItem(k) }catch(e){} }
};

/* ================= DATE HELPERS ================= */
function fmtKey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtLong(d){ return d.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"}); }
function upcomingSunday(){
  const d = new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate() + (7 - d.getDay()) % 7);
  return d;
}
function shiftDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }

/* ================= SHEET FETCH ================= */
function gvizUrl(tab){
  const base = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:json`;
  return tab ? base + `&sheet=${encodeURIComponent(tab)}` : base;
}
function parseGviz(text){
  const m = text.match(/setResponse\(([\s\S]*)\);?\s*$/);
  if(!m) throw new Error("Unexpected response format");
  return JSON.parse(m[1]);
}
function parseMDY(s){
  const m = String(s).trim().match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(!m) return null;
  let y = +m[3]; if(y < 100) y += 2000;   // "05/31/26" → 2026
  return new Date(y, +m[1]-1, +m[2]);
}
function cellDate(cell){
  if(!cell) return null;
  if(typeof cell.v === "string"){
    const m = cell.v.match(/Date\((\d+),(\d+),(\d+)/);
    if(m) return new Date(+m[1], +m[2], +m[3]);
    const p = parseMDY(cell.v); if(p) return p;
  }
  if(cell.f){ const p = parseMDY(cell.f); if(p) return p; }
  return null;
}
function cellText(cell){
  if(!cell) return "";
  if(cell.f !== undefined && cell.f !== null) return String(cell.f).trim();
  if(cell.v !== undefined && cell.v !== null) return String(cell.v).trim();
  return "";
}

let tabCache = {};
async function fetchRows(tab){
  const r = await fetch(gvizUrl(tab));
  return parseGviz(await r.text()).table.rows;
}
async function loadRows(tab, isMain){
  if(tabCache[tab]) return tabCache[tab];
  let rows;
  try{ rows = await fetchRows(tab); }
  catch(e){
    if(!isMain) throw e;
    rows = await fetchRows(null);   // main tab falls back to the first tab
  }
  tabCache[tab] = rows;
  return rows;
}

function findRowByDate(rows, key){
  return rows.find(r => {
    const rd = cellDate(r.c && r.c[0]);
    return rd && fmtKey(rd) === key;
  });
}
// Pair a names cell with a callings cell line by line: "Name — Calling"
function zipLines(namesCell, callingsCell){
  const names = cellText(namesCell).split(/\n/).map(s=>s.trim()).filter(Boolean);
  const calls = cellText(callingsCell).split(/\n/).map(s=>s.trim());
  return names.map((n,i)=> calls[i] ? n + " — " + calls[i] : n);
}

async function loadDate(d){
  setStatus("Loading agenda…");
  sheetValues = {}; topic = "";
  const key = fmtKey(d);

  const [main, ann, biz] = await Promise.allSettled([
    loadRows(CONFIG.TAB, true),
    loadRows(CONFIG.TAB_ANNOUNCEMENTS),
    loadRows(CONFIG.TAB_BUSINESS)
  ]);

  if(main.status !== "fulfilled"){
    setStatus("Couldn't reach the spreadsheet. Check your connection, then retry.", true);
    overrides = loadOverrides(key);
    render(); return;
  }

  const row = findRowByDate(main.value, key);
  if(row){
    for(const f of ALL_FIELDS){
      if(f.src && COL[f.src] !== undefined) sheetValues[f.id] = cellText(row.c[COL[f.src]]);
    }
    topic = cellText(row.c[COL.topic]);
  }

  // Announcements tab — column B holds that Sunday's announcements
  if(ann.status === "fulfilled"){
    const r = findRowByDate(ann.value, key);
    if(r){
      let t = cellText(r.c[1]);
      if(/^n\/?a\.?$/i.test(t)) t = "";
      sheetValues.announcements = t;
    }
  }

  // Business tab — B/C releases · D/E callings · F other (records, ordinations, etc.)
  if(biz.status === "fulfilled"){
    const r = findRowByDate(biz.value, key);
    if(r){
      const releases = zipLines(r.c[1], r.c[2]);
      const callings = zipLines(r.c[3], r.c[4]);
      const parts = [];
      if(releases.length) parts.push("Releases:\n" + releases.join("\n"));
      if(callings.length) parts.push("Callings:\n" + callings.join("\n"));
      sheetValues.releases = parts.join("\n\n");
      sheetValues.wardBusiness = cellText(r.c[5]);
    }
  }

  const problems = [];
  if(!row) problems.push("no agenda row for this date");
  if(ann.status !== "fulfilled") problems.push("Announcements tab didn't load");
  if(biz.status !== "fulfilled") problems.push("Business tab didn't load");
  if(problems.length) setStatus("Note: " + problems.join("; ") + ".", true);
  else setStatus("");

  overrides = loadOverrides(key);
  render();
}

/* ================= OVERRIDES ================= */
function loadOverrides(key){
  try{ return JSON.parse(store.get("conduct:"+key)) || {}; }catch(e){ return {}; }
}
function saveOverrides(){
  const key = fmtKey(meetingDate);
  if(Object.keys(overrides).length) store.set("conduct:"+key, JSON.stringify(overrides));
  else store.del("conduct:"+key);
}
function valueOf(id){
  return overrides[id] !== undefined ? overrides[id] : (sheetValues[id] || "");
}

/* ================= OVERVIEW RENDER ================= */
const $ = id => document.getElementById(id);

function setStatus(msg, isErr){
  const el = $("status");
  el.textContent = msg;
  el.className = "status" + (isErr ? " err" : "");
  if(isErr){
    const b = document.createElement("button");
    b.textContent = "Retry";
    b.onclick = () => { tabCache = {}; loadDate(meetingDate); };
    el.append(" ", b);
  }
}

function render(){
  $("dateLine").textContent = meetingDate.toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});
  $("datePick").value = fmtKey(meetingDate);
  $("topicBox").textContent = topic;

  const main = $("sections"); main.innerHTML = "";
  for(const sec of SECTIONS){
    const el = document.createElement("section");
    el.className = "wave";
    el.innerHTML = `<div class="wavehead"><span class="num">${sec.num}.</span><h2>${sec.title}</h2></div>`;
    for(const f of sec.fields){
      const wrap = document.createElement("div");
      wrap.className = "field" + (f.type==="hymn" ? " hymn":"") + (overrides[f.id]!==undefined ? " edited":"");
      const lab = document.createElement("label");
      lab.htmlFor = "in-"+f.id;
      lab.innerHTML = `${f.label} <span class="edited-dot" title="edited locally"></span>`;
      const reset = document.createElement("button");
      reset.className = "resetbtn"; reset.type="button"; reset.textContent = "reset";
      reset.onclick = ()=>{ delete overrides[f.id]; saveOverrides(); render(); };
      lab.appendChild(reset);
      const input = document.createElement(f.type==="long" ? "textarea" : "input");
      input.id = "in-"+f.id;
      input.value = valueOf(f.id);
      input.placeholder = f.src ? "—" : "Add before meeting…";
      if(f.type==="long"){ input.rows = 1; autoGrow(input); }
      input.addEventListener("input", ()=>{
        const v = input.value;
        if(v === (sheetValues[f.id]||"")) delete overrides[f.id];
        else overrides[f.id] = v;
        wrap.classList.toggle("edited", overrides[f.id]!==undefined);
        saveOverrides();
        if(f.type==="long") autoGrow(input);
      });
      wrap.append(lab, input);
      el.appendChild(wrap);
    }
    if(sec.static){
      const st = document.createElement("div");
      st.className = "staticline"; st.textContent = sec.static;
      el.appendChild(st);
    }
    main.appendChild(el);
  }
}
function autoGrow(t){ t.style.height="auto"; t.style.height = t.scrollHeight+"px"; }

/* ================= MEETING MODE ================= */
function hymnParts(v){
  const m = v.match(/^#?\s*(\d+)\s*[.,–—-]?\s*(.*)$/);
  return m ? {num:m[1], name:m[2]||""} : {num:"", name:v};
}
function renderMeeting(){
  const sec = SECTIONS[sectionIdx];
  $("mtitle").textContent = sec.num + ".  " + sec.title;
  const prog = $("progress"); prog.innerHTML = "";
  SECTIONS.forEach((s,i)=>{
    const sp = document.createElement("span");
    sp.className = "step" + (i<sectionIdx?" done": i===sectionIdx?" now":"");
    sp.textContent = s.num;
    prog.appendChild(sp);
  });
  const body = $("mbody"); body.innerHTML = "";
  if(sectionIdx===0){
    body.insertAdjacentHTML("beforeend",
      `<div class="mrow"><div class="mlabel">Date</div><div class="mvalue">${fmtLong(meetingDate)}</div></div>`);
  }
  for(const f of sec.fields){
    const v = valueOf(f.id);
    if(!v && f.optional) continue;
    const row = document.createElement("div");
    if(f.type==="hymn" && v){
      const h = hymnParts(v);
      row.className = "mrow hymnrow";
      row.innerHTML = `<div class="mlabel">${f.label}</div>
        <div class="mvalue">${h.num?`<span class="hymnnum">${h.num}</span>`:""}<span>${esc(h.name)}</span></div>`;
    }else{
      row.className = "mrow";
      row.innerHTML = `<div class="mlabel">${f.label}</div>
        <div class="mvalue ${f.type==="long"?"long":""}">${v?esc(v):"—"}</div>`;
    }
    body.appendChild(row);
  }
  if(sec.static){
    body.insertAdjacentHTML("beforeend",
      `<div class="mrow static"><div class="mvalue">${sec.static}</div></div>`);
  }
  $("backBtn").style.visibility = sectionIdx===0 ? "hidden":"visible";
  $("nextBtn").textContent = sectionIdx===SECTIONS.length-1 ? "End Meeting" : "Next";
  window.scrollTo(0,0);
  saveSession();
}
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>"); }

function startMeeting(){
  sectionIdx = 0;
  document.body.classList.add("in-meeting");
  acquireWakeLock();
  renderMeeting();
}
function exitMeeting(){
  document.body.classList.remove("in-meeting");
  releaseWakeLock();
  store.del("conduct:session");
  render();
}
function saveSession(){
  store.set("conduct:session", JSON.stringify({date:fmtKey(meetingDate), section:sectionIdx}));
}

/* ---- wake lock keeps the screen on during the meeting ---- */
async function acquireWakeLock(){
  try{ wakeLock = await navigator.wakeLock.request("screen"); }catch(e){}
}
function releaseWakeLock(){ try{ wakeLock && wakeLock.release(); wakeLock=null; }catch(e){} }
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState==="visible" && document.body.classList.contains("in-meeting")) acquireWakeLock();
});

/* ================= EVENTS ================= */
$("prevSun").onclick = ()=>{ meetingDate = shiftDays(meetingDate,-7); loadDate(meetingDate); };
$("nextSun").onclick = ()=>{ meetingDate = shiftDays(meetingDate, 7); loadDate(meetingDate); };
$("datePick").onchange = e=>{
  const [y,m,d] = e.target.value.split("-").map(Number);
  if(y){ meetingDate = new Date(y,m-1,d); loadDate(meetingDate); }
};
$("startBtn").onclick = startMeeting;
$("exitBtn").onclick = exitMeeting;
$("backBtn").onclick = ()=>{ if(sectionIdx>0){ sectionIdx--; renderMeeting(); } };
$("nextBtn").onclick = ()=>{
  if(sectionIdx < SECTIONS.length-1){ sectionIdx++; renderMeeting(); }
  else exitMeeting();
};

/* ================= INIT ================= */
(async function init(){
  meetingDate = upcomingSunday();
  // resume mid-meeting if the page reloaded
  let session = null;
  try{ session = JSON.parse(store.get("conduct:session")); }catch(e){}
  if(session && session.date){
    const [y,m,d] = session.date.split("-").map(Number);
    meetingDate = new Date(y,m-1,d);
  }
  await loadDate(meetingDate);
  if(session){
    sectionIdx = Math.min(session.section||0, SECTIONS.length-1);
    document.body.classList.add("in-meeting");
    acquireWakeLock();
    renderMeeting();
  }
})();
</script>
</body>
